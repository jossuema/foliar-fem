[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foliar-fem"
version = "0.2.0"
description = "From 2D segmentation masks to agronomic parameters and infection-front simulation, via constrained Delaunay triangulation and P1 finite elements"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jossue Marcillo" }]
keywords = ["plant-pathology", "black-sigatoka", "banana", "finite-elements",
            "geodesic-distances", "meshing", "reaction-diffusion",
            "precision-agriculture"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Natural Language :: English",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-image>=0.20,<0.26",
  "scikit-fmm>=2023.4",
  "shapely>=2.0,<3",
  "triangle>=20220202",
  "matplotlib>=3.7,<4",
  "pandas>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/jossuema/foliar-fem"

[tool.setuptools]
packages = ["foliar"]
