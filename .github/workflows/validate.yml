name: validate

# The project's safety net. validate.py tests MATHEMATICAL PROPERTIES against
# exact solutions rather than memorised values, so a correct change should not
# move it and an incorrect one turns it red.
#
# It runs in two environments on purpose:
#   - pinned : the exact versions the published figures were produced with
#   - latest : the newest versions requirements.txt admits
# The second one can fail without the code being wrong: it means a library
# changed and the reference figures need review. That is why it does not block.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pinned:
    name: pinned versions (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Numerical validation
        run: python validate.py

  latest:
    name: latest versions (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Numerical validation
        run: python validate.py
