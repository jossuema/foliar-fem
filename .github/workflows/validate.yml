name: validate

# La red de seguridad del proyecto. validate.py prueba PROPIEDADES MATEMATICAS
# contra soluciones exactas, no valores memorizados, asi que un cambio correcto
# no deberia moverlo y uno incorrecto lo pone en rojo.
#
# Se corre en dos entornos a proposito:
#   - lock  : las versiones exactas con las que se produjeron las cifras publicadas
#   - suelto: las versiones mas nuevas que admite requirements.txt
# El segundo puede fallar sin que el codigo este mal: significa que una libreria
# cambio y hay que revisar las cifras de referencia. Por eso no bloquea.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lock:
    name: versiones fijadas (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Validacion numerica
        run: python validate.py

  suelto:
    name: versiones al dia (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validacion numerica
        run: python validate.py
